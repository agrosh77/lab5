
<!DOCTYPE html>
<html>
<head>
    <title>Aging Across America</title>

    <!-- Loading Leaflet for the interactive map. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

    <!-- My GeoJSON data, converted to JavaScript after preparing it in QGIS. -->
    <script src="data.js"></script>

    <!-- Billboard.js is what I'm using to make the age group charts. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/billboard.min.css">
    <script src="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/billboard.pkgd.min.js"></script>

    <style>
        /* Keeping the colors soft so the blue choropleth stands out. */
        body {
            background-color: #eaf0f5;
            font-family: Verdana, Arial, sans-serif;
            margin: 0;
            padding: 30px 20px;
            color: #24476A;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #24476A;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #526779;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* The white frame helps separate the map from the page background. */
        .map-frame {
            background: white;
            padding: 12px;
            border: 1px solid #c8d6e2;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(36, 71, 106, 0.12);
        }

        #map {
            height: 500px;
            border-radius: 6px;
            overflow: hidden;
        }

        .map-caption {
            text-align: center;
            font-size: 13px;
            color: #526779;
            margin-top: 12px;
        }

        /* Styling the legend so the percentage ranges are easy to read. */
        .legend {
            padding: 6px 8px;
            line-height: 18px;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }

        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }

        /* White background keeps the charts readable over the map. */
        .leaflet-tooltip {
            background: white;
            opacity: 1;
        }

        /* Credits go below the map, aligned to the left. */
        .page-footer {
            margin-top: 28px;
            padding: 0 4px 20px;
            text-align: left;
            font-size: 12px;
            line-height: 1.7;
            color: #526779;
        }

        .page-footer hr {
            border: none;
            border-top: 1px solid #c8d6e2;
            margin-bottom: 18px;
        }

        .page-footer p {
            margin: 8px 0;
        }

        .page-footer strong {
            color: #24476A;
        }
    </style>
</head>

<body>
    <div class="page-container">

        <h1>Aging Across America</h1>

        <p class="subtitle">
            Population Aged 60 and Older by State | 2020
        </p>

        <div class="map-frame">
            <div id="map"></div>

            <p class="map-caption">
                Hover over a state to explore its population by age group.
            </p>
        </div>

        <footer class="page-footer">
            <hr>

            <p><strong>Data Source:</strong> 2020 U.S. state population by age group.
    Data provided from Lab 5 (GIS387).</p>

         
        </footer>
    </div>

    <!-- Billboard.js uses this space to create the chart for each state. -->
    <div id="chart"></div>

    <script>
        // Starting with a view of the contiguous United States.
        var map = L.map('map', {
            center: [39, -98],
            zoom: 4
        });

        // Using a light gray basemap so it doesn't compete with the data.
        L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
            {
                attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
                maxZoom: 11,
                minZoom: 2
            }
        ).addTo(map);

        // These are the five percentage ranges I classified in QGIS.
        // Darker blue means a higher percentage of residents aged 60+.
        function getColor(value) {
            return value > 25.33 ? '#2171b5' :
                   value > 24.36 ? '#6baed6' :
                   value > 23.34 ? '#9ecae1' :
                   value > 22.57 ? '#c6dbef' :
                                   '#eff3ff';
        }

        // Using my calculated Pct60Plus field to color each state.
        function style(feature) {
            return {
                fillColor: getColor(feature.properties.Pct60Plus),
                weight: 2,
                opacity: 1,
                color: 'gray',
                fillOpacity: 0.9
            };
        }

        // Making a bar chart to show the age distribution within each state.
        // I converted the population counts into percentages so states
        // with very different population sizes can still be compared.
        function makeChart(props) {

            var total = props.POP2020;

            bb.generate({
                bindto: "#chart",

                size: {
                    height: 240,
                    width: 340
                },

                title: {
                    text: props.NAME + " - Population by Age (2020)"
                },

                data: {
                    columns: [
                        ["Under 19", props.PopUnder19 / total * 100],
                        ["20-29", props.Pop20to29 / total * 100],
                        ["30-39", props.Pop30to39 / total * 100],
                        ["40-49", props.Pop40to49 / total * 100],
                        ["50-59", props.Pop50to59 / total * 100],
                        ["60+", props.Pop60Plus / total * 100]
                    ],

                    type: "bar",

                    labels: {
                        format: function(value) {
                            return value.toFixed(1) + "%";
                        }
                    }
                },

                // Rotating the chart makes the bars horizontal.
                axis: {
                    rotated: true,
                    x: {
                        show: false
                    },
                    y: {
                        label: "Percent of State Population",
                        min: 0,
                        padding: {
                            bottom: 0
                        }
                    }
                },

                legend: {
                    position: "right"
                }
            });
        }

        // Highlighting a state when the mouse moves over it.
        // The thicker dashed border makes it easier to see which state is selected.
        function highlightFeature(e) {
            var layer = e.target;

            layer.setStyle({
                weight: 5,
                color: '#666',
                dashArray: '6',
                fillOpacity: 0.7
            });

            // Keeping the highlighted state above the other map layers.
            if (!L.Browser.ie && !L.Browser.opera) {
                layer.bringToFront();
            }
        }

        var geojson;

        // Returning the state to its original color and border.
        function resetHighlight(e) {
            geojson.resetStyle(e.target);
        }

        // Connecting the hover actions to each state.
        function onEachFeature(feature, layer) {
            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight
            });
        }

        // Getting the chart container so it can be used as a tooltip.
        var tooltip = document.getElementById("chart");

        // Adding the state boundaries, colors, and chart tooltips to the map.
        geojson = L.geoJson(statesData, {
            style: style,
            onEachFeature: onEachFeature
        }).bindTooltip(tooltip).addTo(map);

        // Drawing the chart after the tooltip opens.
        // This keeps the chart working when moving between different states.
        geojson.on('tooltipopen', function(e) {
            makeChart(e.layer.feature.properties);
        });

        // Adding the legend in the bottom-right corner.
        var legend = L.control({position: 'bottomright'});

        legend.onAdd = function(map) {

            var div = L.DomUtil.create('div', 'legend');

            // These are the same class boundaries used for the map colors.
            var grades = [16.27, 22.57, 23.34, 24.36, 25.33];

            var labels = [
                '16.27–22.57%',
                '22.57–23.34%',
                '23.34–24.36%',
                '24.36–25.33%',
                '25.33–29.74%'
            ];

            div.innerHTML =
                '<b>Population Aged 60+<br>(% of State Population, 2020)<br></b>';

            // Creating a color box and label for each of the five classes.
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(grades[i] + 0.01) + '"></i> ' +
                    labels[i] + '<br>';
            }

            return div;
        };

        legend.addTo(map);

        // A little surprise for anyone who checks the console!
console.log(
    "%c🗺️ Look at this beautiful map!",
    "color: #24476A; font-size: 22px; font-weight: bold;"
);

console.log(
    "%cMade with curiosity and caffeine💙",
    "color: #3C7A6B; font-size: 13px; font-style: italic;"
);

    </script>
</body>
</html>
